    28	3	check_present_solutions_compliance	2025-08-13 06:18:36	test.account@promptstore.dev	2025-08-13 06:18:36	test.account@promptstore.dev	{"name":"Present Solutions Compliance Check","templateEngine":"handlebars","prompts":[{"role":"system","prompt":"PRESENT SOLUTIONS Compliance Check Prompt\\nInstructions: Review the conversation/call transcript and evaluate whether the following solution presentation criteria were met. Mark each item as \\"Achieved\\" or \\"Not Achieved\\" and provide the overall compliance score.\\n\\nChecklist:\\n- Recommended a specific solution\\n- Presented a feature of the solution relevant to the customer's situation\\n- Connected the feature to a personalised benefit\\n- Asked agreement question\\n- Checked understanding of recommendation\\n- Confirmed satisfaction with recommendation\\n\\nCompliance Score: /6 (%)"},{"role":"user","prompt":"Transcript:\\n||transcript}}"}],"key":"check_present_solutions_compliance","chunkId":"UBdiGpgBi12hmUyGmrMg","isSystem":false}
    29	3	sales_conversation_analysis	2025-08-13 06:18:36	test.account@promptstore.dev	2025-08-13 06:18:36	test.account@promptstore.dev	{"name":"Sales Conversation Analysis","templateEngine":"handlebars","prompts":[{"role":"user","prompt":"Analyze this sales conversation using the 5-stage framework. Evaluate each stage:\\n\\nENGAGE: How well did they welcome and connect with the customer?\\nDISCOVER: How effectively did they understand the customer's situation and needs?\\nPRESENT SOLUTIONS: How well did they provide relevant, personalized solutions?\\nGAIN AGREEMENT: How effectively did they address concerns and move forward?\\nCLOSE: How well did they wrap up with clear next steps and satisfaction?\\n\\nTRANSCRIPT:\\n||transcript}}\\n\\nBASIC METRICS:\\n||json basicMetrics}}\\n\\nRespond with ONLY valid JSON:\\n{\\n  \\"deepScores\\": {\\n    \\"scores\\": {\\n      \\"engage\\": {\\n        \\"score\\": 75,\\n        \\"details\\": \\"Greeted customer by name 3x. Established credibility mentioning 5 years experience. Clear assistance offer. Explained process but rushed permission to proceed. Missing personal connection.\\",\\n        \\"benchmark\\": \\"Top performers establish rapport in first 60 seconds with personal connection, use name 4+ times, always seek permission\\"\\n      },\\n      \\"discover\\": {\\n        \\"score\\": 85,\\n        \\"details\\": \\"Identified core reason: cost reduction need. Mapped current 3-vendor setup vs desired unified platform. Quantified $50k savings. Acknowledged frustration 4x. Asked 12 discovery questions. Missed timeline urgency.\\",\\n        \\"benchmark\\": \\"Excellent discovery uncovers 3-5 pain points with emotional drivers, quantifies impact, confirms understanding before solutions\\"\\n      },\\n      \\"presentSolutions\\": {\\n        \\"score\\": 70,\\n        \\"details\\": \\"Recommended Premium package with integration features. Connected to cost savings goal. Asked 'How does this sound?' Only presented 1 option. Missed ROI calculation and team adoption benefits.\\",\\n        \\"benchmark\\": \\"Best practice: present 2-3 options, address 100% of identified pain points, quantify ROI, confirm understanding\\"\\n      },\\n      \\"gainAgreement\\": {\\n        \\"score\\": 80,\\n        \\"details\\": \\"Proposed pilot program as next step. Addressed timeline concern with phased approach. Asked for CFO referral. Clarified budget process. Training hesitation not fully resolved. No written commitment.\\",\\n        \\"benchmark\\": \\"Top sellers address all concerns with examples, offer alternatives, secure verbal commitment in 78% of qualified calls\\"\\n      },\\n      \\"close\\": {\\n        \\"score\\": 90,\\n        \\"details\\": \\"Scheduled Tuesday 2pm follow-up with decision maker. Sent calendar invite. Summarized 3 decisions. Confirmed satisfaction. Offered resources. Personalized farewell referencing growth goals.\\",\\n        \\"benchmark\\": \\"Excellent closing includes calendar invite during call, written summary, confirmed stakeholders, satisfaction check\\"\\n      }\\n    },\\n    \\"overallScore\\": 80,\\n    \\"summary\\": \\"Strong framework execution with excellent discovery (85) and closing (90). Room to improve personal connection in engage phase and solution options in presentation. Successfully moved from problem identification to scheduled next steps with decision maker.\\"\\n  }\\n}"}],"key":"sales_conversation_analysis","versions":[{"id":"82e935b5-0712-4d24-93a0-d6abb436e4a1","created":"2025-07-17T06:58:32.752Z","promptSet":{"name":"Sales Conversation Analysis","templateEngine":"handlebars","prompts":[{"role":"user","prompt":"Analyze this sales conversation for effectiveness. Focus on:\\n- Listening quality (not just time, but active listening indicators)\\n- Pain point discovery (specific problems identified)\\n- Value articulation (how well solutions matched problems)\\n- Objection handling (concerns raised and addressed)\\n- Next steps clarity\\n\\nTRANSCRIPT:\\n||transcript}}\\n\\nBASIC METRICS:\\n||json basicMetrics}}\\n\\nRespond with ONLY valid JSON:\\n{\\n  \\"deepScores\\": {\\n    \\"scores\\": {\\n      \\"listening\\": {\\n        \\"score\\": 75,\\n        \\"details\\": \\"You spoke 60% of the time. Asked 8 follow-up questions. Interrupted 2 times.\\",\\n        \\"benchmark\\": \\"Top salespeople speak <40% of the time\\"\\n      },\\n      \\"painPointDiscovery\\": {\\n        \\"score\\": 88,\\n        \\"details\\": \\"Identified 3 major pain points: budget constraints, integration issues, team adoption\\",\\n        \\"benchmark\\": \\"Excellent - most sales calls identify 1-2 pain points\\"\\n      },\\n      \\"valueArticulation\\": {\\n        \\"score\\": 65,\\n        \\"details\\": \\"Connected solution to 2 of 3 pain points. Missed opportunity on integration concerns.\\",\\n        \\"benchmark\\": \\"Good sellers address 100% of identified pain points\\"\\n      },\\n      \\"objectionHandling\\": {\\n        \\"score\\": 70,\\n        \\"details\\": \\"Client raised 2 concerns. Addressed pricing well but rushed through security question.\\",\\n        \\"benchmark\\": \\"Address all objections with specific examples or data\\"\\n      },\\n      \\"nextSteps\\": {\\n        \\"score\\": 90,\\n        \\"details\\": \\"Clear next meeting scheduled with agenda. Decision maker confirmed.\\",\\n        \\"benchmark\\": \\"Excellent - specific date, time, and participants confirmed\\"\\n      }\\n    },\\n    \\"overallScore\\": 78,\\n    \\"summary\\": \\"A solid sales conversation with good pain discovery but room to improve listening ratio and value articulation.\\"\\n  }\\n}\\n"}],"key":"sales_conversation_analysis","chunkId":"JxeZ2JcBi12hmUyGIrPX","id":150,"workspaceId":10,"skill":"sales_conversation_analysis","created":"2025-07-05T03:20:04.000Z","createdBy":"m4rkmo@gmail.com","modified":"2025-07-17T06:58:09.000Z","modifiedBy":"m4rkmo@gmail.com"},"title":"Version 1","username":"m4rkmo@gmail.com","version":1},{"id":"aa43ba07-4886-4e3c-9406-12dbf391ff24","created":"2025-07-17T07:21:34.382Z","promptSet":{"name":"Sales Conversation Analysis","templateEngine":"handlebars","prompts":[{"role":"user","prompt":"Analyze this sales conversation using the 5-stage sales framework. Evaluate each stage for effectiveness:\\n\\nENGAGE: How well did the salesperson welcome and connect with the customer?\\nDISCOVER: How effectively did they understand the customer's situation and needs?\\nPRESENT SOLUTIONS: How well did they provide relevant, personalized solutions?\\nGAIN AGREEMENT: How effectively did they address concerns and move forward?\\nCLOSE: How well did they wrap up with clear next steps and satisfaction?\\n\\nTRANSCRIPT:\\n||transcript}}\\n\\nBASIC METRICS:\\n||json basicMetrics}}\\n\\nRespond with ONLY valid JSON:\\n{\\n  \\"frameworkAnalysis\\": {\\n    \\"stages\\": {\\n      \\"engage\\": {\\n        \\"score\\": 75,\\n        \\"elements\\": {\\n          \\"greeting\\": \\"Used customer's name 3 times\\",\\n          \\"credibility\\": \\"Mentioned 5 years industry experience\\",\\n          \\"assistance\\": \\"Clear offer to help with specific needs\\",\\n          \\"process\\": \\"Explained call structure\\",\\n          \\"permission\\": \\"Asked before proceeding\\"\\n        },\\n        \\"missing\\": [\\"Personal connection beyond business\\"],\\n        \\"benchmark\\": \\"Top performers establish rapport in first 60 seconds\\"\\n      },\\n      \\"discover\\": {\\n        \\"score\\": 85,\\n        \\"elements\\": {\\n          \\"underlyingReason\\": \\"Identified need for cost reduction\\",\\n          \\"currentSituation\\": \\"Mapped current 3-vendor setup\\",\\n          \\"desiredSituation\\": \\"Understood goal of unified platform\\",\\n          \\"impact\\": \\"Quantified $50k annual savings potential\\",\\n          \\"emotions\\": \\"Acknowledged frustration with complexity\\"\\n        },\\n        \\"missing\\": [\\"Deeper exploration of timeline urgency\\"],\\n        \\"benchmark\\": \\"Excellent discovery uncovers 3-5 pain points with emotional drivers\\"\\n      },\\n      \\"presentSolutions\\": {\\n        \\"score\\": 70,\\n        \\"elements\\": {\\n          \\"specificSolution\\": \\"Recommended Premium package\\",\\n          \\"relevantFeatures\\": \\"Highlighted integration capabilities\\",\\n          \\"personalizedBenefits\\": \\"Connected to their cost reduction goal\\",\\n          \\"agreementQuestion\\": \\"Asked 'How does this sound?'\\",\\n          \\"understanding\\": \\"Confirmed comprehension of key features\\"\\n        },\\n        \\"missing\\": [\\"Multiple solution options\\", \\"ROI calculation\\"],\\n        \\"benchmark\\": \\"Best practice: present 2-3 options with clear differentiation\\"\\n      },\\n      \\"gainAgreement\\": {\\n        \\"score\\": 80,\\n        \\"elements\\": {\\n          \\"nextSteps\\": \\"Proposed pilot program\\",\\n          \\"referralAsk\\": \\"Requested introduction to CFO\\",\\n          \\"concerns\\": \\"Addressed implementation timeline worry\\",\\n          \\"clarification\\": \\"Explored budget approval process\\",\\n          \\"alternative\\": \\"Offered phased rollout option\\"\\n        },\\n        \\"missing\\": [\\"Written commitment\\", \\"Specific timeline\\"],\\n        \\"benchmark\\": \\"Top sellers gain verbal commitment in 78% of qualified calls\\"\\n      },\\n      \\"close\\": {\\n        \\"score\\": 90,\\n        \\"elements\\": {\\n          \\"assistance\\": \\"Offered to send resources\\",\\n          \\"summary\\": \\"Recapped 3 key decisions made\\",\\n          \\"timeline\\": \\"Set follow-up for Tuesday 2pm\\",\\n          \\"satisfaction\\": \\"Confirmed customer felt heard\\",\\n          \\"personalizedFarewell\\": \\"Referenced their growth goals\\"\\n        },\\n        \\"missing\\": [\\"Calendar invite sent during call\\"],\\n        \\"benchmark\\": \\"Excellent - clear next steps with confirmed stakeholders\\"\\n      }\\n    },\\n    \\"overallScore\\": 80,\\n    \\"strengths\\": [\\n      \\"Strong discovery process with emotional connection\\",\\n      \\"Clear next steps and follow-up scheduled\\",\\n      \\"Good objection handling in gain agreement phase\\"\\n    ],\\n    \\"improvements\\": [\\n      \\"Build more personal rapport in engage phase\\",\\n      \\"Present multiple solution options\\",\\n      \\"Secure written commitment before close\\"\\n    ],\\n    \\"summary\\": \\"Solid execution of the sales framework with particularly strong discovery and close stages. Focus on enhancing solution presentation with more options and securing stronger commitments.\\"\\n  }\\n}"}],"key":"sales_conversation_analysis","chunkId":"TBctF5gBi12hmUyGerPp","id":150,"workspaceId":10,"skill":"sales_conversation_analysis","created":"2025-07-05T03:20:04.000Z","createdBy":"m4rkmo@gmail.com","modified":"2025-07-17T07:20:29.000Z","modifiedBy":"m4rkmo@gmail.com"},"title":"Version 2","username":"m4rkmo@gmail.com","version":2}],"chunkId":"TRdCF5gBi12hmUyGj7Ow","isSystem":false}
    30	3	summarize_agent_performance	2025-08-13 06:18:36	test.account@promptstore.dev	2025-08-13 06:18:36	test.account@promptstore.dev	{"name":"Summarize Agent Performance","templateEngine":"handlebars","prompts":[{"role":"system","prompt":"# Home Care Sales Agent Evaluation Framework\\n\\nYour task is to evaluate a sales agent helping customers connect with quality Home Care Package providers and Nursing Homes. Agents are expected to exhibit the following behaviors:\\n\\n## Clear and Effective Communication\\n\\n**Definition:** Providing information about care options in a clear, accessible manner using appropriate language for the customer's situation.\\n\\n**Key Behaviors:**\\n* Breaking down complex care terminology into understandable terms\\n* Organizing information logically (care needs → options → next steps)\\n* Checking for understanding regularly\\n* Using clear transitions between topics\\n* Leaving space for two-way dialogue\\n\\n**Examples:**\\n* \\"Let me explain what Level 2 Home Care Package means in practical terms...\\"\\n* \\"Does that make sense? Would you like me to clarify anything about the assessment process?\\"\\n\\n## Confidence and Expertise\\n\\n**Definition:** Demonstrating knowledge about care options, providers, and processes while instilling trust in customers during a vulnerable time.\\n\\n**Key Behaviors:**\\n* Providing accurate information about care levels, providers, and processes\\n* Explaining eligibility requirements and assessment procedures confidently\\n* Offering insights into provider quality and service differences\\n* Using authoritative language appropriately\\n\\n**Examples:**\\n* \\"Based on what you've shared, you'd likely qualify for a Level 3 package, which includes...\\"\\n* \\"I can assure you that all our partner providers are ACFI-approved and regularly audited...\\"\\n\\n## Empathy and Tone\\n\\n**Definition:** Showing understanding and sensitivity to the emotional challenges of seeking care for oneself or loved ones.\\n\\n**Key Behaviors:**\\n* Acknowledging the difficulty of care decisions\\n* Validating customer emotions and concerns\\n* Using supportive, respectful language\\n* Recognizing family dynamics and stress\\n\\n**Examples:**\\n* \\"I understand how overwhelming it can feel when you're trying to find the right care for your mother.\\"\\n* \\"It's completely natural to feel anxious about this transition. Many families go through these same concerns.\\"\\n\\n## Active Listening\\n\\n**Definition:** Demonstrating attentiveness to customer needs, preferences, and concerns through paraphrasing and confirming understanding.\\n\\n**Key Behaviors:**\\n* Reflecting back customer priorities and concerns\\n* Asking clarifying questions about care needs\\n* Summarizing key points to confirm understanding\\n* Responding to both spoken and unspoken concerns\\n\\n**Examples:**\\n* \\"So you're looking for care that allows your father to stay at home while getting help with daily tasks. Is that right?\\"\\n* \\"I hear that maintaining independence is really important to you. Let's talk about how home care can support that.\\"\\n\\n## Objection Handling\\n\\n**Definition:** Effectively addressing concerns about cost, quality, timing, or family dynamics by acknowledging concerns and providing relevant solutions.\\n\\n**Key Behaviors:**\\n* Acknowledging and validating concerns\\n* Providing specific information to address worries\\n* Offering practical solutions or alternatives\\n* Checking if concerns have been resolved\\n\\n**Examples:**\\n* \\"I understand your concern about the cost. Let me explain what government subsidies are available...\\"\\n* \\"Many families worry about quality of care. Here's how we ensure our providers meet high standards...\\"\\n* \\"Does that help address your concern about the waiting time?\\"\\n\\n---\\n\\n## Evaluation Instructions\\n\\nProvide a concise summary of the agent's performance in each of the categories below. Provide a few examples from the content where the agent excelled in the category if any, and a few examples where they didn't if any.\\nThe response format must be a JSON object with the following fields and format:\\n{\\n  \\"communication\\": {\\n    \\"summary\\": \\"A concise summary of the agent's performance in the communication category.\\",\\n    \\"score\\": 75,\\n    \\"strengths_to_leverage_examples\\": \\"examples of the agent's strengths in the communication category\\",\\n    \\"areas_for_improvement_examples\\": \\"examples of the agent's areas for improvement in the communication category\\"\\n  },\\n  \\"confidence\\": {\\n    \\"summary\\": \\"A concise summary of the agent's performance in the confidence category.\\",\\n    \\"score\\": 75,\\n    \\"strengths_to_leverage_examples\\": \\"examples of the agent's strengths in the confidence category\\",\\n    \\"areas_for_improvement_examples\\": \\"examples of the agent's areas for improvement in the confidence category\\"\\n  },\\n  \\"empathy\\": {\\n    \\"summary\\": \\"A concise summary of the agent's performance in the empathy category.\\",\\n    \\"score\\": 75,\\n    \\"strengths_to_leverage_examples\\": \\"examples of the agent's strengths in the empathy category\\",\\n    \\"areas_for_improvement_examples\\": \\"examples of the agent's areas for improvement in the empathy category\\"\\n  },\\n  \\"listening\\": {\\n    \\"summary\\": \\"A concise summary of the agent's performance in the listening category.\\",\\n    \\"score\\": 75,\\n    \\"strengths_to_leverage_examples\\": \\"examples of the agent's strengths in the listening category\\",\\n    \\"areas_for_improvement_examples\\": \\"examples of the agent's areas for improvement in the listening category\\"\\n  },\\n  \\"objection_handling\\": {\\n    \\"summary\\": \\"A concise summary of the agent's performance in the objection handling category.\\",\\n    \\"score\\": 75,\\n    \\"strengths_to_leverage_examples\\": \\"examples of the agent's strengths in the objection handling category\\",\\n    \\"areas_for_improvement_examples\\": \\"examples of the agent's areas for improvement in the objection handling category\\"\\n  }\\n}\\n"},{"role":"user","prompt":"Performance:\\n||json evaluation_summaries}}"}],"key":"summarize_agent_performance","chunkId":"PhcS75cBi12hmUyG0LOx","isSystem":false}
