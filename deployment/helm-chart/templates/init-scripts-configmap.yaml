ity Consistency**: When extracting entities, it's vital to ensure consistency.\\nIf an entity, such as \\"John Doe\\", is mentioned multiple times in the text but is referred to by different names or pronouns (e.g., \\"Joe\\", \\"he\\"), always use the most complete identifier for that entity throughout the knowledge graph. In this example, use \\"John Doe\\" as the entity name.\\n## 3. Format\\nOutput the list of entities as a JSON document using the following format:\\n```\\n{\\n  \\"content\\": \\"<original input content>\\",\\n  \\"entities\\": [\\"<list of entities>\\", ...]\\n}\\n```\\n## 4. Strict Compliance\\nAdhere to the rules strictly. Non-compliance will result in termination.","role":"system"},{"role":"user","prompt":"Extract a list of entities from the following content:\\n\\"\\"\\"${content}\\"\\"\\"\\n\\nOutput:"}],"summary":"Algorithm extracts\\n","isPublic":true,"isTypesDefined":true,"arguments":{"type":"object","properties":{"content":{"type":"string"}},"required":["content"]},"id":64,"skill":"entity_extraction","created":"2023-11-26T06:40:55.000Z","createdBy":"m4rkmo@gmail.com","modified":"2023-11-26T08:00:50.000Z","modifiedBy":"m4rkmo@gmail.com"},"title":"Initial version","username":"m4rkmo@gmail.com","version":1},{"id":"6a907888-4a2e-493c-b2ab-915e66a8371d","created":"2023-11-26T21:28:18.730Z","promptSet":{"name":"Entity Extraction","isPublic":true,"description":"Extract a list of defined entity types from the given content.","isTypesDefined":true,"templateEngine":"handlebars","prompts":[{"prompt":"Identify the following entities in the content below: [||list entityTypes}}].\\n\\nLet's think about the problem. Apply the following steps:\\n1. Identify all the nouns in the content.\\n2. Classify each noun by the type of entity using the list of entities above.\\n3. Ignore any noun that is classified as Other.\\n4. Finally, list the entities found below. You need only include each found entity once.\\n\\nReturn the result as a JSON document. \\n``