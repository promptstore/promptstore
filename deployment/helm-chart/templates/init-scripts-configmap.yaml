    ALTER TABLE public.users
        OWNER TO psadmin;

    ALTER SEQUENCE public.users_id_seq
        OWNER to psadmin;

    ALTER SEQUENCE public.users_id_seq
        OWNED BY public.users."id";

    -- Index: users_user_id_key

