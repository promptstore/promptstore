    19	3	collaboration_conversation_analysis	2025-08-13 06:18:36	test.account@promptstore.dev	2025-08-13 06:18:36	test.account@promptstore.dev	{"name":"Collaboration Conversation Analysis","templateEngine":"handlebars","prompts":[{"role":"user","prompt":"Analyze this collaboration meeting for effectiveness. Focus on:\\n- Participation balance (who dominated, who was silent)\\n- Idea building (how ideas evolved through discussion)\\n- Decision quality (clear outcomes vs circular discussion)\\n- Action clarity (specific ownership and deadlines)\\n- Team dynamics (psychological safety, conflict handling)\\n\\nTRANSCRIPT:\\n||transcript}}\\n\\nBASIC METRICS:\\n||json basicMetrics}}\\n\\nRespond with ONLY valid JSON:\\n{\\n  \\"deepScores\\": {\\n    \\"scores\\": {\\n      \\"participation\\": {\\n        \\"score\\": 72,\\n        \\"details\\": \\"3 of 5 participants spoke >20% each. 2 members contributed <10%.\\",\\n        \\"benchmark\\": \\"Effective teams have all members speaking 15-25% of time\\"\\n      },\\n      \\"ideaBuilding\\": {\\n        \\"score\\": 85,\\n        \\"details\\": \\"12 ideas proposed, 8 built upon by others. Strong 'yes, and' culture evident.\\",\\n        \\"benchmark\\": \\"Excellent - high-performing teams build on 60%+ of ideas\\"\\n      },\\n      \\"decisionQuality\\": {\\n        \\"score\\": 68,\\n        \\"details\\": \\"Made 2 clear decisions but spent 15 min in circular discussion on budget.\\",\\n        \\"benchmark\\": \\"Top teams make decision or explicitly table within 10 minutes\\"\\n      },\\n      \\"actionClarity\\": {\\n        \\"score\\": 90,\\n        \\"details\\": \\"5 actions assigned with owners and dates. All confirmed understanding.\\",\\n        \\"benchmark\\": \\"Excellent - all actions have owner, deadline, and success criteria\\"\\n      },\\n      \\"teamDynamics\\": {\\n        \\"score\\": 78,\\n        \\"details\\": \\"Healthy debate on 2 topics. One moment of tension handled well.\\",\\n        \\"benchmark\\": \\"Good - constructive conflict with respectful resolution\\"\\n      }\\n    },\\n    \\"overallScore\\": 79,\\n    \\"summary\\": \\"Productive collaboration with strong idea building but needs better participation balance and faster decision-making.\\"\\n  }\\n}\\n"}],"key":"collaboration_conversation_analysis","chunkId":"KBea2JcBi12hmUyGSrMX","isSystem":false}
    20	3	conversation_structure_analysis	2025-08-13 06:18:36	test.account@promptstore.dev	2025-08-13 06:18:36	test.account@promptstore.dev	{"name":"Conversation Structure Analysis","templateEngine":"handlebars","prompts":[{"role":"user","prompt":"Analyze this ||conversationType}} conversation transcript for basic metrics and structure.\\n\\nTRANSCRIPT:\\n||transcript}}\\n\\nRespond with ONLY valid JSON (no markdown):\\n{\\n  \\"basicMetrics\\": {\\n    \\"participants\\": [\\"Speaker A\\", \\"Speaker B\\"],\\n    \\"duration\\": \\"estimated duration in minutes\\",\\n    \\"totalTurns\\": 45,\\n    \\"wordCount\\": {\\"Speaker A\\": 1200, \\"Speaker B\\": 800},\\n    \\"talkTimeRatio\\": {\\"Speaker A\\": 60, \\"Speaker B\\": 40},\\n    \\"questionCount\\": {\\"Speaker A\\": 8, \\"Speaker B\\": 12},\\n    \\"longestMonologue\\": {\\"speaker\\": \\"Speaker A\\", \\"words\\": 245},\\n    \\"averageTurnLength\\": {\\"Speaker A\\": 26.7, \\"Speaker B\\": 17.8},\\n    \\"topicChanges\\": 5,\\n    \\"interruptions\\": 3\\n  }\\n}\\n"}],"key":"conversation_structure_analysis","chunkId":"JheX2JcBi12hmUyGO7Ni","isSystem":false}
