    26	3	general_conversation_analysis	2025-08-13 06:18:36	test.account@promptstore.dev	2025-08-13 06:18:36	test.account@promptstore.dev	{"name":"General Conversation Analysis","templateEngine":"handlebars","prompts":[{"role":"user","prompt":"Analyze this general conversation for effectiveness. Focus on:\\n- Engagement quality (genuine interest vs politeness)\\n- Conversational flow (natural vs forced)\\n- Depth achieved (surface vs meaningful)\\n- Reciprocity (balanced sharing and curiosity)\\n- Connection building (rapport and understanding)\\n\\nTRANSCRIPT:\\n||transcript}}\\n\\nBASIC METRICS:\\n||json basicMetrics}}\\n\\nRespond with ONLY valid JSON:\\n{\\n  \\"deepScores\\": {\\n    \\"scores\\": {\\n      \\"engagement\\": {\\n        \\"score\\": 78,\\n        \\"details\\": \\"Both parties asked follow-up questions. 3 moments of shared laughter.\\",\\n        \\"benchmark\\": \\"Good engagement shows curiosity beyond initial questions\\"\\n      },\\n      \\"flow\\": {\\n        \\"score\\": 85,\\n        \\"details\\": \\"Natural topic transitions. Only 1 awkward pause. Good rhythm throughout.\\",\\n        \\"benchmark\\": \\"Excellent - conversations should feel effortless\\"\\n      },\\n      \\"depth\\": {\\n        \\"score\\": 65,\\n        \\"details\\": \\"Stayed surface-level on 3 of 5 topics. Went deeper on career discussion.\\",\\n        \\"benchmark\\": \\"Meaningful conversations go beyond facts to feelings/values\\"\\n      },\\n      \\"reciprocity\\": {\\n        \\"score\\": 72,\\n        \\"details\\": \\"You shared 4 personal stories, they shared 6. Question ratio fairly balanced.\\",\\n        \\"benchmark\\": \\"Best conversations have 40-60% balance in all metrics\\"\\n      },\\n      \\"connection\\": {\\n        \\"score\\": 80,\\n        \\"details\\": \\"Found 3 common interests. Exchanged contact info. Made future plans.\\",\\n        \\"benchmark\\": \\"Good connection leads to concrete next interactions\\"\\n      }\\n    },