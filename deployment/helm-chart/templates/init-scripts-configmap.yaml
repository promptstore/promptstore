    3	3	1	17	{"conversationType":"sales","transcript":"Sales Rep: Good morning, Mrs. Johnson. Thank you for taking the time to speak with me today about our Sunset Manor care facility. How are you feeling about the transition for your mother?\\n\\nMrs. Johnson: Well, I'm quite worried actually. She's been living independently for so long, and I'm not sure how she'll adjust to a care environment.\\n\\nSales Rep: I completely understand your concerns. That's very natural. Can you tell me a bit about your mother's current situation and what specific care needs she has?\\n\\nMrs. Johnson: She's 87 and has been having some mobility issues lately. She fell last month, which really scared us. She also sometimes forgets to take her medication.\\n\\nSales Rep: I see. Safety and medication management are definitely areas where we excel. Our facility has 24/7 nursing staff and we have a comprehensive medication management program. Would you like me to explain how that works?\\n\\nMrs. Johnson: Yes, please. And what about the social aspects? She's quite social and I worry she'll feel isolated.\\n\\nSales Rep: That's a great question. We have a full activities program with daily social events, group meals, and even pet therapy sessions. Many of our residents form close friendships here. Would you be interested in scheduling a tour so your mother can see the facility and meet some of our current residents?\\n\\nMrs. Johnson: That sounds like a good idea. What would be the next steps if we decide to move forward?\\n\\nSales Rep: Excellent! I can schedule a tour for this week if that works for you. We'll also need to complete an assessment of your mother's care needs to ensure we can provide the right level of support. The whole process typically takes about two weeks from initial visit to move-in."}	{"basicMetrics":{"participants":["Sales Rep","Mrs. Johnson"],"duration":"10","totalTurns":12,"wordCount":{"Sales Rep":276,"Mrs. Johnson":196},"talkTimeRatio":{"Sales Rep":58,"Mrs. John