    8	3	4	25	{"basicMetrics":{"participants":["Sales Rep","Prospect"],"duration":45,"totalTurns":32,"wordCount":{"Sales Rep":1850,"Prospect":1200},"talkTimeRatio":{"Sales Rep":65,"Prospect":35},"questionCount":{"Sales Rep":12,"Prospect":8},"longestMonologue":{"speaker":"Sales Rep","words":180},"averageTurnLength":{"Sales Rep":57.8,"Prospect":37.5},"topicChanges":6,"interruptions":"2 by Sales Rep, 1 by Prospect"},"transcript":"Sales Rep: Hi Sarah, thanks for taking the time to meet with me today. I know you're busy running operations at TechFlow Solutions. How are things going with your current customer support processes?\\n\\nProspect: Hi Mike, thanks for reaching out. Honestly, things have been pretty challenging lately. We're growing fast - about 40% this quarter - but our support team is drowning. We're still using a mix of email and spreadsheets to track everything.\\n\\nSales Rep: That sounds incredibly frustrating. When you say drowning, what does that look like day-to-day for your team?\\n\\nProspect: Well, tickets are getting lost, response times are averaging 3-4 days instead of our target 24 hours, and my team is working overtime constantly. Customer satisfaction scores have dropped from 4.2 to 3.1 in the past six months.\\n\\nSales Rep: Ouch, that's a significant drop. I can imagine how stressful that must be for everyone involved. Have you looked into any solutions to address this?\\n\\nProspect: We've evaluated a few options, but most seem either too expensive or too complex for our team to implement quickly. We need something that works out of the box but can scale with us.\\n\\nSales Rep: That makes perfect sense. Quick implementation and scalability are crucial when you're in growth mode. Our platform actually specializes in exactly that - we can have you up and running in under two weeks, and we've helped companies like yours reduce response times by 70% on average.\\n\\nProspect: That sounds promising, but I'm concerned about the learning curve. My team is already stretched thin.\\n\\nSales Rep: I completely understand that concern. That's actually one of our key differentiators. Our interface is designed to feel familiar - it's similar to Gmail, so your team can start using it immediately. Plus, we provide dedicated onboarding support and training for the first 30 days.\\n\\nProspect: What about cost? We're budget-conscious right now.\\n\\nSales Rep: I appreciate you being upfront about that. Let me ask - what's the cost of your current situation? With overtime, potential customer churn, and the stress on your team?\\n\\nProspect: Good point. We're probably spending about $15,000 a month on overtime alone, and we've lost three major clients in the past quarter due to slow response times.\\n\\nSales Rep: So you're looking at significant ongoing costs and revenue impact. Our solution would actually cost less than what you're currently spending on overtime, while solving the root problem. Would it be helpful if I showed you a quick demo of how this would work specifically for your team?\\n\\nProspect: Yes, I'd like to see that. But I'll need to involve my IT director in any final decisions.\\n\\nSales Rep: Absolutely, that makes complete sense. How about we schedule a 30-minute demo for next Tuesday? I can show you the platform, and we can have your IT director join for the technical discussion. Does 2 PM work for both of you?\\n\\nProspect: Let me check... Yes, that works. Can you send me some case studies of similar companies beforehand?\\n\\nSales Rep: Perfect, I'll send you three case studies of companies in your industry and size range by tomorrow morning. I'll also include our implementation timeline so you can see exactly what the next steps would look like. Sound good?\\n\\nProspect: That sounds great. I'm looking forward to seeing how this could help us get back on track.\\n\\nSales Rep: Excellent. I'll send those materials over first thing tomorrow, and I'll see you and your IT director next Tuesday a