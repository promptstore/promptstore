    10	1	kg_extraction	2025-08-13 06:08:58	sys.account@promptstore.dev	2025-08-13 06:08:58	sys.account@promptstore.dev	{"name":"Knowledge Graph Extraction","isTypesDefined":true,"templateEngine":"handlebars","prompts":[{"role":"system","prompt":"# Knowledge Graph Instructions for GPT-4\\n## 1. Overview\\nYou are a top-tier algorithm designed for extracting information in structured formats to build a knowledge graph.\\n- **Nodes** represent entities and concepts. They're akin to Wikipedia nodes.\\n- The aim is to achieve simplicity and clarity in the knowledge graph, making it accessible for a vast audience.\\n## 2. Labeling Nodes\\n- **Consistency**: Ensure you use basic or elementary types for node labels.\\n  - For example, when you identify an entity representing a person, always label it as **\\"person\\"**. Avoid using more specific terms like \\"mathematician\\" or \\"scientist\\".\\n- **Node IDs**: Never utilize integers as node IDs. Node IDs should be names or human-readable identifiers found in the text.\\n- **Completeness**: Every node should have at least a Node ID, type, and name.\\n- **Allowed Node Labels:** ||list allowedNodes}}\\n- **Allowed Relationship Types**: ||list allowedRels}}\\n## 3. Handling Numerical Data and Dates\\n- Numerical data, like age or other related information, should be incorporated as attributes or properties of the respective nodes.\\n- **No Separate Nodes for Dates/Numbers**: Do not create separate nodes for dates or numerical values. Always attach them as attributes or properties of nodes.\\n- **Property Format**: Properties must be in a key-value format.\\n- **Quotation Marks**: Never use escaped single or double quotes within property values.\\n- **Naming Convention**: Use camelCase for property keys, e.g., `birthDate`.\\n## 4. Coreference Resolution\\n- **Maintain Entity Consistency**: When extracting entities, it's vital to ensure consistency.\\nIf an entity, such as \\"John Doe\\", is mentioned multiple times in the text but is referred to by different names or pronouns (e.g., \\"Joe\\", \\"he\\"), always use the most complete identifier for that entity throughout the knowledge graph. In this example, use \\"John Doe\\" as the entity ID.\\nRemember, the knowledge graph should be coherent and easily understandable, so maintaining consistency in entity references is crucial.\\n## 5. Conciseness\\n- Limit the number of nodes to no more than 10 of the most relevant and connected nodes.\\n- If 'Allowed Relationship Types' is not specified, limit the number of relationship types to no more than 10 of the most relevant and common relationships.\\n## 6. Strict Compliance\\nAdhere to the rules strictly. Non-compliance will result in termination."},{"prompt":"Use the given format to extract information from the following input: ||content}}\\n\\nTip: Make sure to answer in the correct format","role":"user"}],"arguments":{"type":"object","properties":{"allowedNodes":{"type":"array","items":{"type":"string"}},"allowedRels":{"type":"array","items":{"type":"string"}},"content":{"type":"string"}},"required":["content"]},"key":"kg_extraction","summary":"Algorithm's knowledge"}
    11	1	cypher_generation	2025-08-13 06:08:58	sys.account@promptstore.dev	2025-08-13 06:08:58	sys.account@promptstore.dev	{"name":"Generate Cypher","description":"Generate Cypher statement to query a graph database.","isTypesDefined":true,"templateEngine":"handlebars","prompts":[{"prompt":"Task: Generate Cypher statement to query a graph database.\\nInstructions:\\nUse only the provided relationship types and properties in the schema.\\nDo not use any other relationship types or properties that are not provided.\\n\\nSchema:\\n|| context }}\\n\\nNote: Do not include any explanations or apologies in your responses.\\nDo not respond to any questions that might ask anything else than for you to construct a Cypher statement.\\nDo not include any text except the generated Cypher statement.\\nIf the answer is a single value, return the output using the alias 'output'.\\nThe property existence syntax `... exists(variable.property)` is no longer supported. Please use `variable.property IS NOT NULL` instead.\\n\\nThe question is:\\n|| content }}","role":"user"}],"arguments":{"type":"object","properties":{"content":{"type":"string"},"context":{"type":"string"}},"required":["content","context"]},"key":"cypher_generation","summary":"Generate Cypher"}
    12	1	proofread	2025-08-13 06:08:58	sys.account@promptstore.dev	2025-08-13 06:08:58	sys.account@promptstore.dev	{"name":"Proofread","tags":["review"],"isTypesDefined":true,"templateEngine":"es6","prompts":[{"prompt":"List any spelling or grammatical errors in the content below.\\n\\nContent:\\n\\"\\"\\"\\n${content}\\n\\"\\"\\"\\n\\nErrors:","role":"user"}],"arguments":{"type":"object","properties":{"content":{"type":"string","title":"Content","description":"The content to proof read."}},"required":["content"],"title":"Variables"},"key":"proofread","summary":"Errors found."}
    13	1	qa	2025-08-13 06:08:58	sys.account@promptstore.dev	2025-08-13 06:08:58	sys.account@promptstore.dev	{"name":"Q&A","tags":["rag"],"description":"A question answering prompt.","isTypesDefined":true,"templateEngine":"es6","prompts":[{"prompt":"Use the following pieces of context to answer the question at the end. If you don't know the answer, just say that you don't know, don't try to make up an answer. Use only information with a citation in your answer. Include the list of citations with your answer. Include a citation only once. Format the answer as follows.\\n\\nFormat:\\n<answer>\\nCitations: <list of citations separated by semi-colon>\\n\\nContext:\\n${context}\\n\\nQuestion:\\n${content}\\n\\nHelpful Answer:","role":"user"}],"arguments":{"type":"object","properties":{"context":{"type":"string","title":"Context","description":"Additional information to help answer the question."},"content":{"type":"string","title":"Content","description":"The question to answer."}},"required":["context","content"],"title":"Variables"},"key":"qa","summary":"Use the context"}
    14	1	refinement	2025-08-13 06:08:58	sys.account@promptstore.dev	2025-08-13 06:08:58	sys.account@promptstore.dev	{"name":"Refine using Feedback","description":"Correct or improve content given the feedback provided.","isTypesDefined":true,"templateEngine":"es6","prompts":[{"prompt":"The following content was not appropriate.\\n\\n\\"\\"\\"${content}\\"\\"\\"\\n\\nCorrect this content using the following feedback \\"\\"\\"${feedback}}}\\"\\"\\".\\n\\nCorrection:","role":"user"}],"arguments":{"type":"object","properties":{"content":{"type":"string","title":"Content","description":"The content that needs correcting."},"feedback":{"type":"string","title":"Feedback","description":"Correction instructions."}},"required":["content","feedback"],"title":"Variables"},"key":"refinement","summary":"Not appro-p"}
    15	1	general_sql_query	2025-08-13 06:08:58	sys.account@promptstore.dev	2025-08-13 06:08:58	sys.account@promptstore.dev	{"name":"General SQL Query","isPublic":true,"description":"SQL generation plus ambiguity identification.","isTypesDefined":true,"templateEngine":"handlebars","prompts":[{"prompt":"You are a ||dialect}} SQL expert. Given an input question, first create a syntactically correct ||dialect}} SQL query to run. Never query for all columns from a table. You must query only the columns that are needed to answer the question. Wrap each column name in backticks (`) to denote them as delimited identifiers.\\n\\nPay attention to use only the column names you can see in the tables below. Be careful to not query for columns that do not exist. Also, pay attention to which column is in which table.\\n\\nThe SQL must be a ||#if dialect}}||dialect}}||else}}ANSII||/if}} compatible query. Do not include any explanations or surround the SQL in quotes or back ticks. Just show the SQL.\\n\\nIf the question is ambiguous, list the ambiguities.\\n\\nOnly use the following tables:\\n||context}}\\n\\nReturn the response as JSON in the following format:\\n```\\n{\\n  \\"question\\": \\"<original question>\\",\\n  \\"ambiguities\\": [\\"<list of ambiguities>\\", ...],\\n  \\"query\\": \\"<the SQL to run>\\"\\n}\\n```","role":"system"},{"prompt":"Question: ||content}}","role":"user"}],"arguments":{"type":"object","properties":{"content":{"type":"string"},"dialect":{"type":"string"}},"required":["content"]},"key":"general_sql_query","versions":[{"id":"bee216b9-b211-4a35-847f-584808e3f13a","created":"2023-11-28T00:54:49.636Z","promptSet":{"name":"General SQL Query","isTypesDefined":true,"templateEngine":"es6","prompts":[{"prompt":"You are a SQL expert. Given an input question, first create a syntactically correct SQL query to run. Never query for all columns from a table. You must query only the columns that are needed to answer the question. Wrap each column name in backticks (`) to denote them as delimited identifiers.\\n\\nPay attention to use only the column names you can see in the tables below. Be careful to not query for columns that do not exist. Also, pay attention to which column is in which table.\\n\\nThe SQL must be an ANSII standard query. Do not include any explanations or surround the SQL in quotes or back ticks. Just show the SQL.\\n\\nIf the question is ambiguous, list the ambiguities.\\n\\nOnly use the following tables:\\n${context}\\n\\nUse the following format:\\n\\nQuestion: Question here\\nAmbiguities: The list of ambiguities\\nSQL: The SQL query to run\\n","role":"system"},{"prompt":"Question: ${content}","role":"user"}],"arguments":{"type":"object","properties":{"content":{"type":"string"}},"required":["content"]},"key":"general_sql_query","summary":"Create SQL query","id":43,"skill":"general_sql_query","created":"2023-11-27T03:59:20.000Z","createdBy":"m4rkmo@gmail.com","modified":"2023-11-27T04:00:18.000Z","modifiedBy":"m4rkmo@gmail.com"},"title":"Initial version","username":"m4rkmo@gmail.com","version":1}],"summary":null}
    16	1	plan	2025-08-13 06:08:58	sys.account@promptstore.dev	2025-08-13 06:08:58	sys.account@promptstore.dev	{"name":"Plan","isPublic":true,"description":"Create an action plan.","templateEngine":"es6","prompts":[{"role":"system","prompt":"Let's first understand the problem and devise a plan to solve the problem. Please output the plan starting with the header 'Plan:' and then followed by a numbered list of steps.\\n\\nYou have access to the following tools:\\n\\n${toolDefinitions}\\n\\nMake the plan the minimum number of steps required to accurately complete the task.\\n\\nDo NOT reference any tool outside of the list above. For example, unless one of the tools above is Wikipedia do not use Wikipedia in a task.\\n\\nIf the task is a question, the final step should almost always be 'Given the above steps taken, please respond to the users original question'. At the end of your plan, say '<END_OF_PLAN>'"},{"role":"user","prompt":"${content}"}],"key":"plan","summary":null}
    17	1	plan_with_tools	2025-08-13 06:08:58	sys.account@promptstore.dev	2025-08-13 06:08:58	sys.account@promptstore.dev	{"name":"Plan with Tools","isPublic":true,"templateEngine":"handlebars","prompts":[{"prompt":"Let's first understand the problem and devise a plan to solve the problem. Please output the plan starting with the header 'Plan:' and then followed by a numbered list of steps. Please make the plan the minimum number of steps required to accurately complete the task. If the task is a question, the final step should almost always be 'Given the above steps taken, please respond to the users original question'. At the end of your plan, say '<END_OF_PLAN>'\\n\\nRespond to the human as helpfully and accurately as possible. You have access to the following tools:||#each tools}}\\n||this.name}}: ||this.description}}, args: ||this.args}}\\n||/each}}\\n\\nUse a json blob to specify a tool by providing an action key (tool name) and an action_input key (tool input).\\n\\nValid \\"action\\" values: \\"Final Answer\\" or one of [||tool_names}}]\\n\\nProvide only ONE action per $JSON_BLOB, as shown:\\n```\\n{\\n  \\"name\\": $TOOL_NAME,\\n  \\"arguments\\": $JSON\\n}\\n```\\n\\nFollow this format:\\n\\nQuestion: input question to answer\\nThought: consider previous and subsequent steps\\nAction:\\n```\\n$JSON_BLOB\\n```\\nObservation: action result\\n... (repeat Thought/Action/Observation N times)\\nThought: I know what to respond\\nAction:\\n```\\n{\\n  \\"name\\": \\"Final Answer\\",\\n  \\"arguments\\": { \\"content\\": \\"Final response to human\\" }\\n}\\n```\\n\\nBegin! Reminder to ALWAYS respond with a valid json blob of a single action. Use tools if necessary. Respond directly if appropriate. Format is Action: ```$JSON_BLOB``` then Observation:.\\nThought:","role":"system"},{"prompt":"||content}}","role":"user"}],"key":"plan_with_tools","summary":null}
