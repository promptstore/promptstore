    24	3	extract_moments_and_quotes	2025-08-13 06:18:36	test.account@promptstore.dev	2025-08-13 06:18:36	test.account@promptstore.dev	{"name":"Extract Moments and Quotes","templateEngine":"handlebars","prompts":[{"role":"user","prompt":"Extract specific moments and quotes from this ||conversationType}} conversation that illustrate successes and failures.\\n\\nTRANSCRIPT:\\n||transcript}}\\n\\nSCORES AND ANALYSIS:\\n||json deepScores}}\\n\\nFind 3-4 specific moments with exact or close-to-exact quotes. Respond with ONLY valid JSON:\\n{\\n  \\"specificMoments\\": {\\n    \\"strongMoments\\": [\\n      {\\n        \\"category\\": \\"Active Listening\\",\\n        \\"quote\\": \\"So what I'm hearing is that your main concern is the integration timeline, not the cost itself. Is that right?\\",\\n        \\"impact\\": \\"This reflection statement showed deep understanding and led client to open up more.\\",\\n        \\"timestamp\\": \\"~10 minutes in\\"\\n      }\\n    ],\\n    \\"improvementMoments\\": [\\n      {\\n        \\"category\\": \\"Missed Opportunity\\",\\n        \\"quote\\": \\"Client: 'We've had bad experiences with similar tools...' You: 'Our tool is different because...'\\",\\n        \\"impact\\": \\"Jumped to defense instead of exploring their specific bad experiences.\\",\\n        \\"betterApproach\\": \\"Tell me more about those experiences. What specifically went wrong?\\",\\n        \\"timestamp\\": \\"~15 minutes in\\"\\n      }\\n    ],\\n    \\"keyTakeaways\\": [\\n      \\"You excel at building rapport in the first 5 minutes\\",\\n      \\"Tendency to rush through concerns when time is short\\",\\n      \\"Strong closer - always end with clear next steps\\"\\n    ]\\n  }\\n}\\n"}],"key":"extract_moments_and_quotes","chunkId":"Kxed2JcBi12hmUyGlrPb","isSystem":false}
