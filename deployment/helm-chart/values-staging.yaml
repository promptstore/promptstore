## Telemetry / harness observability
telemetry:
  stream_secret: ""  # Set from Secrets Manager (GitHub secret TELEMETRY_STREAM_SECRET)
  stale_span_ttl_ms: "600000"
  stale_span_sweep_ms: "60000"
  span_reaper_ttl_ms: "1800000"
  span_reaper_interval_ms: "300000"

## Frontend feature flags (baked into the build by the build-frontend job)
features:
  apps: "false"
  imagegen: "false"
  agent_networks: "false"
  guardrails: "true"
  background_jobs: "false"
  monitoring: "true"
  support: "false"
