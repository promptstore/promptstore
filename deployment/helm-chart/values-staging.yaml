appname: "promptstore"
namespace: "promptstore"

aws:
  accountId: "457663127744"
  region: "ap-southeast-2"

ecr:
  repository: "europalabs/promptstore"

eks:
  clusterName: "tapitriager"
  region: "ap-southeast-2"

bucket: "promptstore-staging-data-ap-southeast-2"
documents_prefix: "documents"
images_prefix: "images"
filestore_prefix: ""

containerRegistry: ""  # Set via --set during deploy (ECR URI)

version: "0.7.65"

port: "5000"

base_url: ""

env: "prod"

no_auth: "false"
minimal_install: "true"
auth_provider: "cognito"

# Database initialization options
dbInit:
  dropTables: false

# IRSA Service Account (from CDK PromptstoreIamStack output)
serviceAccount:
  roleArn: ""  # e.g. arn:aws:iam::457663127744:role/promptstore-eks-s3-role

# Cognito (from CDK PromptstoreCognitoStack outputs)
cognito:
  region: "ap-southeast-2"
  user_pool_id: ""
  client_id: ""
  domain: ""
  authority: ""
  callbackUrl: "https://staging.openaiplatform.com/callback"
  logoutUrl: "https://staging.openaiplatform.com"

promptstore:
  email: ""
  search_embedding_model: ""
  search_embedding_provider: ""
  search_index_name: "pssearch"
  search_node_label: "Object"
  search_workspace: "1"
  search_vectorstore_provider: ""
  rules_engine_service_url: ""
  system_workspace_id: "1"

ingress:
  domain: "ps-staging.openaiplatform.com"
  certificateArn: ""  # Set from CDK PromptstoreAcmStack output

# PostgreSQL metastore (CDK PromptstoreRdsStack output)
db:
  host: ""  # Set from CDK output: promptstore-postgres-db endpoint
  name: "promptstore"
  user: "dbadmin"
  pass: ""  # Set from Secrets Manager

# Elasticsearch
elasticsearch:
  host: ""
  port: "9200"
  use_ssl: "true"
  username: ""
  password: ""

# Redis (CDK PromptstoreElastiCacheStack output)
redis:
  host: ""  # Set from CDK output: ElastiCache primary endpoint
  port: "6379"
  pass: ""  # Set from Secrets Manager

# S3 filestore (replaces MinIO - IRSA provides credentials)
s3:
  endpoint: "https://s3.ap-southeast-2.amazonaws.com"
  access_key: ""
  secret_key: ""
  region: "ap-southeast-2"

# Background job processing (Temporal Cloud)
temporal:
  api_url: ""
  namespace: "promptstore"
  tls: "true"
  api_key: ""

# Log aggregator
loki:
  api_url: ""

########

## PLUGINS ########

plugins:
  embedding: ""
  extractor: "csv|CSV Parser|./plugins/extractors/csv,json|JSON Parser|./plugins/extractors/json,text|Text Parser|./plugins/extractors/text"
  featurestore: ""
  graphstore: ""
  guardrail: "emojiremover|Emoji Remover|./plugins/guardrails/emojiremover|type=output"
  llm: "bedrock|AWS Bedrock|./plugins/llms/bedrock,litellm|LiteLLM|./plugins/llms/litellm"
  loader: ""
  metricstore: ""
  modelprovider: ""
  outputparser: "numberedlist|Numbered List|./plugins/outputparsers/numberedlist,list|Inline List|./plugins/outputparsers/list,json|Parse or fix JSON|./plugins/outputparsers/json,boolean|Boolean|./plugins/outputparsers/boolean,datetime|DateTime|./plugins/outputparsers/datetime,action|Action|./plugins/outputparsers/action"
  passport: "localapikey|Local API Key|./plugins/passport/localapikey"
  sqlsource: ""
  tool: "calculator|Calculator|./plugins/tools/calculator"
  vectorstore: ""

