name: Build and Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - testing
          - staging
          - production
        default: "testing"
      image_tag:
        description: "Image tag to deploy (leave empty to build new image)"
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: string
      image_tag:
        description: "Image tag to deploy"
        required: false
        type: string

# Prevent concurrent deployments to the same environment
concurrency:
  group: deploy-${{ inputs.environment || github.event.inputs.environment || 'testing' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # Job 1: Determine Environment and Configuration
  # All non-secret config is read from deployment/helm-chart/values-<env>.yaml
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      values_file: ${{ steps.env.outputs.values_file }}
      should_build: ${{ steps.env.outputs.should_build }}
      # AWS / EKS
      aws_account_id: ${{ steps.config.outputs.aws_account_id }}
      aws_region: ${{ steps.config.outputs.aws_region }}
      ecr_repository: ${{ steps.config.outputs.ecr_repository }}
      eks_cluster_name: ${{ steps.config.outputs.eks_cluster_name }}
      eks_region: ${{ steps.config.outputs.eks_region }}
      k8s_namespace: ${{ steps.config.outputs.k8s_namespace }}
      # Cognito (non-secret resource IDs and URLs)
      cognito_region: ${{ steps.config.outputs.cognito_region }}
      cognito_user_pool_id: ${{ steps.config.outputs.cognito_user_pool_id }}
      cognito_client_id: ${{ steps.config.outputs.cognito_client_id }}
      cognito_domain: ${{ steps.config.outputs.cognito_domain }}
      cognito_authority: ${{ steps.config.outputs.cognito_authority }}
      cognito_callback_url: ${{ steps.config.outputs.cognito_callback_url }}
      cognito_logout_url: ${{ steps.config.outputs.cognito_logout_url }}
      auth_provider: ${{ steps.config.outputs.auth_provider }}
      no_auth: ${{ steps.config.outputs.no_auth }}
      file_bucket: ${{ steps.config.outputs.file_bucket }}
      search_index_name: ${{ steps.config.outputs.search_index_name }}
      # ARNs (non-secret)
      acm_certificate_arn: ${{ steps.config.outputs.acm_certificate_arn }}
      irsa_role_arn: ${{ steps.config.outputs.irsa_role_arn }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Determine environment
        id: env
        run: |
          ENVIRONMENT='${{ inputs.environment || github.event.inputs.environment || 'testing' }}'
          IMAGE_TAG_INPUT='${{ inputs.image_tag || github.event.inputs.image_tag }}'

          SHOULD_BUILD="true"
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            SHOULD_BUILD="false"
            echo "Using existing image tag: $IMAGE_TAG_INPUT"
          fi

          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

          case "$ENVIRONMENT" in
            testing)   VALUES_FILE='values-testing.yaml' ;;
            staging)   VALUES_FILE='values-staging.yaml' ;;
            production) VALUES_FILE='values-production.yaml' ;;
            *)
              echo "ERROR: Unknown environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

          echo "values_file=$VALUES_FILE" >> $GITHUB_OUTPUT

      - name: Read configuration from values file
        id: config
        run: |
          VALUES_FILE="deployment/helm-chart/${{ steps.env.outputs.values_file }}"
          echo "Reading configuration from ${VALUES_FILE}"

          if [ ! -f "${VALUES_FILE}" ]; then
            echo "ERROR: Values file not found: ${VALUES_FILE}"
            exit 1
          fi

          # AWS / EKS
          echo "aws_account_id=$(yq '.aws.accountId' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "aws_region=$(yq '.aws.region' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "ecr_repository=$(yq '.ecr.repository' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "eks_cluster_name=$(yq '.eks.clusterName' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "eks_region=$(yq '.eks.region' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "k8s_namespace=$(yq '.namespace' ${VALUES_FILE})" >> $GITHUB_OUTPUT

          # Cognito (non-secret)
          echo "cognito_region=$(yq '.cognito.region' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(yq '.cognito.user_pool_id' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "cognito_client_id=$(yq '.cognito.client_id' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "cognito_domain=$(yq '.cognito.domain' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "cognito_authority=$(yq '.cognito.authority' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "cognito_callback_url=$(yq '.cognito.callbackUrl' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "cognito_logout_url=$(yq '.cognito.logoutUrl' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "auth_provider=$(yq '.auth_provider' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "no_auth=$(yq '.no_auth' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "file_bucket=$(yq '.bucket' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "search_index_name=$(yq '.promptstore.search_index_name' ${VALUES_FILE})" >> $GITHUB_OUTPUT

          # ARNs (non-secret)
          echo "acm_certificate_arn=$(yq '.ingress.certificateArn' ${VALUES_FILE})" >> $GITHUB_OUTPUT
          echo "irsa_role_arn=$(yq '.serviceAccount.roleArn' ${VALUES_FILE})" >> $GITHUB_OUTPUT

  # Job 2: Build Frontend (React)
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.should_build == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        env:
          FRONTEND_ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
          REACT_APP_AUTH_PROVIDER: ${{ needs.determine-environment.outputs.auth_provider }}
          REACT_APP_NO_AUTH: ${{ needs.determine-environment.outputs.no_auth }}
          REACT_APP_FILE_BUCKET: ${{ needs.determine-environment.outputs.file_bucket }}
          REACT_APP_SEARCH_INDEX: ${{ needs.determine-environment.outputs.search_index_name }}
          REACT_APP_COGNITO_AUTHORITY: ${{ needs.determine-environment.outputs.cognito_authority }}
          REACT_APP_COGNITO_CLIENT_ID: ${{ needs.determine-environment.outputs.cognito_client_id }}
          REACT_APP_COGNITO_REDIRECT_URI: ${{ needs.determine-environment.outputs.cognito_callback_url }}
          REACT_APP_COGNITO_LOGOUT_REDIRECT_URI: ${{ needs.determine-environment.outputs.cognito_logout_url }}
          REACT_APP_COGNITO_DOMAIN: ${{ needs.determine-environment.outputs.cognito_domain }}
          REACT_APP_COGNITO_SCOPE: "openid email profile"
          REACT_APP_COGNITO_USER_POOL_ID: ${{ needs.determine-environment.outputs.cognito_user_pool_id }}
          REACT_APP_AWS_REGION: ${{ needs.determine-environment.outputs.cognito_region }}
          REACT_APP_AUTH_ENABLED: "true"
          CI: false
        run: |
          cat <<EOF > .env.production.local
          EXTEND_ESLINT=true
          REACT_APP_DATA_MAPPER_HELP_URL=https://promptstoredocs.devsheds.io/en/data-mapper
          REACT_APP_HANDLEBARS_GUIDE_URL=https://handlebarsjs.com/guide/
          REACT_APP_DOCUMENTATION_URL=https://promptstoredocs.devsheds.io/
          REACT_APP_ISSUES_URL=https://github.com/promptstore/promptstore/issues
          REACT_APP_AUTH_PROVIDER=${REACT_APP_AUTH_PROVIDER}
          REACT_APP_NO_AUTH=${REACT_APP_NO_AUTH}
          REACT_APP_FILE_BUCKET=${REACT_APP_FILE_BUCKET}
          REACT_APP_SEARCH_INDEX=${REACT_APP_SEARCH_INDEX}
          REACT_APP_ENVIRONMENT=${FRONTEND_ENVIRONMENT}
          REACT_APP_COGNITO_AUTHORITY=${REACT_APP_COGNITO_AUTHORITY}
          REACT_APP_COGNITO_CLIENT_ID=${REACT_APP_COGNITO_CLIENT_ID}
          REACT_APP_COGNITO_REDIRECT_URI=${REACT_APP_COGNITO_REDIRECT_URI}
          REACT_APP_COGNITO_LOGOUT_REDIRECT_URI=${REACT_APP_COGNITO_LOGOUT_REDIRECT_URI}
          REACT_APP_COGNITO_DOMAIN=${REACT_APP_COGNITO_DOMAIN}
          REACT_APP_COGNITO_SCOPE=${REACT_APP_COGNITO_SCOPE}
          REACT_APP_COGNITO_USER_POOL_ID=${REACT_APP_COGNITO_USER_POOL_ID}
          REACT_APP_AWS_REGION=${REACT_APP_AWS_REGION}
          REACT_APP_AUTH_ENABLED=${REACT_APP_AUTH_ENABLED}
          EOF
          npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 1

  # Job 3: Build and Push Docker Image
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [determine-environment, build-frontend]
    if: needs.determine-environment.outputs.should_build == 'true'
    permissions:
      id-token: write
      contents: read
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
      env_tag: ${{ steps.tags.outputs.env_tag }}
      image: ${{ steps.tags.outputs.image }}
      registry: ${{ steps.tags.outputs.registry }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af
          df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.determine-environment.outputs.aws_account_id }}:role/GitHubActionsPromptstoreDeployRole
          aws-region: ${{ needs.determine-environment.outputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tags
        id: tags
        env:
          ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
          ECR_REPOSITORY: ${{ needs.determine-environment.outputs.ecr_repository }}
          AWS_REGION: ${{ needs.determine-environment.outputs.aws_region }}
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          SHORT_SHA=${GITHUB_SHA:0:7}
          SHA_TAG="sha-${SHORT_SHA}"
          ENV_TAG="${ENVIRONMENT}-latest"

          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "env_tag=${ENV_TAG}" >> $GITHUB_OUTPUT
          echo "registry=${ECR_REGISTRY}" >> $GITHUB_OUTPUT
          echo "image=${ECR_REGISTRY}/${ECR_REPOSITORY}:${SHA_TAG}" >> $GITHUB_OUTPUT

          echo "FULL_IMAGE=${ECR_REGISTRY}/${ECR_REPOSITORY}" >> $GITHUB_ENV
          echo "SHA_TAG=${SHA_TAG}" >> $GITHUB_ENV
          echo "ENV_TAG=${ENV_TAG}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.FULL_IMAGE }}:${{ env.SHA_TAG }}
            ${{ env.FULL_IMAGE }}:${{ env.ENV_TAG }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 4: Deploy to EKS
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [determine-environment, build-and-push]
    if: always() && (needs.build-and-push.result == 'success' || needs.determine-environment.outputs.should_build == 'false')
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.determine-environment.outputs.aws_account_id }}:role/GitHubActionsPromptstoreDeployRole
          aws-region: ${{ needs.determine-environment.outputs.aws_region }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ needs.determine-environment.outputs.eks_region }} \
            --name ${{ needs.determine-environment.outputs.eks_cluster_name }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Determine image tag to deploy
        id: deploy-tag
        env:
          SHA_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
          INPUT_TAG: ${{ inputs.image_tag || github.event.inputs.image_tag }}
          SHOULD_BUILD: ${{ needs.determine-environment.outputs.should_build }}
        run: |
          if [ "$SHOULD_BUILD" == "false" ]; then
            DEPLOY_TAG="$INPUT_TAG"
          else
            DEPLOY_TAG="$SHA_TAG"
          fi
          echo "deploy_tag=$DEPLOY_TAG" >> $GITHUB_OUTPUT

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ needs.determine-environment.outputs.k8s_namespace }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        env:
          NAMESPACE: ${{ needs.determine-environment.outputs.k8s_namespace }}
          APP_NAME: promptstore
          IMAGE_TAG: ${{ steps.deploy-tag.outputs.deploy_tag }}
          IMAGE_REGISTRY: ${{ needs.determine-environment.outputs.aws_account_id }}.dkr.ecr.${{ needs.determine-environment.outputs.aws_region }}.amazonaws.com/europalabs
          VALUES_FILE: ${{ needs.determine-environment.outputs.values_file }}
        run: |
          echo "Deploying with the following configuration:"
          echo "  Namespace: ${NAMESPACE}"
          echo "  App Name: ${APP_NAME}"
          echo "  Image Tag: ${IMAGE_TAG}"
          echo "  Image Registry: ${IMAGE_REGISTRY}"
          echo "  Values File: deployment/helm-chart/${VALUES_FILE}"

          [ -n "${{ secrets.PGUSER }}" ] || { echo "ERROR: PGUSER is not set for GitHub environment '${{ needs.determine-environment.outputs.environment }}'"; exit 1; }
          [ -n "${{ secrets.PGPASSWORD }}" ] || { echo "ERROR: PGPASSWORD is not set for GitHub environment '${{ needs.determine-environment.outputs.environment }}'"; exit 1; }

          RUNTIME_SECRETS_FILE="${RUNNER_TEMP}/promptstore-runtime-secrets.yaml"
          cat > "${RUNTIME_SECRETS_FILE}" <<EOF
          db:
            user: |-
              ${{ secrets.PGUSER }}
            pass: |-
              ${{ secrets.PGPASSWORD }}
          redis:
            pass: |-
              ${{ secrets.REDIS_PASSWORD }}
          s3:
            access_key: |-
              ${{ secrets.S3_ACCESS_KEY }}
            secret_key: |-
              ${{ secrets.S3_SECRET_KEY }}
          bedrock:
            access_key_id: |-
              ${{ secrets.BEDROCK_ACCESS_KEY_ID }}
            secret_access_key: |-
              ${{ secrets.BEDROCK_SECRET_ACCESS_KEY }}
          system_api_key: |-
            ${{ secrets.PROMPTSTORE_API_KEY }}
          openai:
            api_key: |-
              ${{ secrets.OPENAI_API_KEY }}
          anthropic:
            api_key: |-
              ${{ secrets.ANTHROPIC_API_KEY }}
          temporal:
            api_key: |-
              ${{ secrets.TEMPORAL_API_KEY }}
          huggingface:
            token: |-
              ${{ secrets.HUGGINGFACE_TOKEN }}
          cohere:
            api_key: |-
              ${{ secrets.COHERE_API_KEY }}
          gemini:
            api_key: |-
              ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          mistral:
            api_key: |-
              ${{ secrets.MISTRAL_API_KEY }}
          google_vertex:
            api_key: |-
              ${{ secrets.GOOGLE_API_KEY }}
          stability_ai:
            api_key: |-
              ${{ secrets.STABILITY_AI_API_KEY }}
          llamaapi:
            api_key: |-
              ${{ secrets.LLAMAAPI_API_KEY }}
          serpapi:
            api_key: |-
              ${{ secrets.SERPAPI_KEY }}
          openweather:
            api_key: |-
              ${{ secrets.OPENWEATHER_API_KEY }}
          mailtrap:
            token: |-
              ${{ secrets.MAILTRAP_TOKEN }}
          jira:
            email: |-
              ${{ secrets.JIRA_EMAIL }}
            pat: |-
              ${{ secrets.JIRA_PAT }}
          trello:
            api_key: |-
              ${{ secrets.TRELLO_API_TOKEN }}
          elasticsearch:
            password: |-
              ${{ secrets.ES_PASS }}
          EOF

          # ACM cert ARN and IRSA role ARN come from the values file,
          # so no --set overrides needed for those.
          # Secrets are injected through a generated values file so Helm
          # does not parse punctuation in credentials passed on the CLI.
          helm upgrade --install ${APP_NAME} \
            --namespace=${NAMESPACE} \
            --set version=${IMAGE_TAG} \
            --set containerRegistry=${IMAGE_REGISTRY} \
            --values deployment/helm-chart/${VALUES_FILE} \
            --values ${RUNTIME_SECRETS_FILE} \
            deployment/helm-chart \
            --wait --timeout 10m

      - name: Verify deployment
        env:
          NAMESPACE: ${{ needs.determine-environment.outputs.k8s_namespace }}
          APP_NAME: promptstore
        run: |
          echo "Waiting for deployment rollout..."
          kubectl rollout status deployment/${APP_NAME} \
            -n ${NAMESPACE} \
            --timeout=5m

          echo "Getting pod status..."
          kubectl get pods -n ${NAMESPACE} -l app=api

      - name: Generate deployment summary
        env:
          ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
          IMAGE_TAG: ${{ steps.deploy-tag.outputs.deploy_tag }}
          SHA_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
          ENV_TAG: ${{ needs.build-and-push.outputs.env_tag }}
          ECR_REPOSITORY: ${{ needs.determine-environment.outputs.ecr_repository }}
          NAMESPACE: ${{ needs.determine-environment.outputs.k8s_namespace }}
          CLUSTER: ${{ needs.determine-environment.outputs.eks_cluster_name }}
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${ENVIRONMENT}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed Image Tag:** ${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${SHA_TAG}" ]; then
            echo "**SHA Tag:** ${SHA_TAG}" >> $GITHUB_STEP_SUMMARY
            echo "**Environment Tag:** ${ENV_TAG}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Repository:** ${ECR_REPOSITORY}" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** ${NAMESPACE}" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${CLUSTER}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${NAMESPACE} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Ingress" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get ingress -n ${NAMESPACE} >> $GITHUB_STEP_SUMMARY || echo "No ingress found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        env:
          ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
          IMAGE_TAG: ${{ steps.deploy-tag.outputs.deploy_tag }}
        run: |
          echo "## Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${ENVIRONMENT}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
