[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptstore-telemetry"
version = "0.1.1"
description = "Fail-safe agentic-harness observability SDK for promptstore"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mark Moloney", email = "markm@tapihq.com" }]
keywords = ["observability", "telemetry", "tracing", "llm", "agents", "promptstore"]
dependencies = []  # standard library only — zero runtime dependencies
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/promptstore/promptstore"
Repository = "https://github.com/promptstore/promptstore"
"Source" = "https://github.com/promptstore/promptstore/tree/main/sdk/python"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["promptstore_telemetry"]
