apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Values.appname }}-ingress"
  namespace: "{{ .Values.namespace }}"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m

spec:
  defaultBackend:
    service:
      name: "{{ .Values.appname }}"
      port:
        number: 5000
